# Automatyczne budowanie i publikacja na GitHub Pages.
#
# Włącz raz: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
# Od tej pory każdy push do gałęzi main: sprawdza kod, buduje assets/
# ze źródeł w src/ i publikuje stronę. Programiści nie muszą commitować
# zbudowanych plików ręcznie (choć repozytorium zawiera aktualny build,
# więc działa też tryb „Deploy from a branch”).

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      - name: Kontrola typów, bazy wiedzy i testy
        run: npm run check

      - name: Build
        run: npm run build

      - name: Przygotowanie strony
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
