<!DOCTYPE html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CivisLex — interaktywny asystent prawno-obywatelski (offline)" />
    <meta name="color-scheme" content="light dark" />
    <title>CivisLex</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/app.css" />
    <script>
      // Ustaw motyw przed pierwszym renderem (brak „mignięcia”).
      try {
        var s = JSON.parse(localStorage.getItem('civislex:settings') || '{}');
        var dark = s.theme ? s.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>CivisLex wymaga włączonej obsługi JavaScript.</noscript>
    <script src="assets/app.js" defer></script>
  </body>
</html>
